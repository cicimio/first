<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone Home Screen</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-drag: none; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111; display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        #phone {
            position: relative; width: 390px; height: 844px; background-color: #000;
            border-radius: 40px; overflow: hidden; box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        /* 背景图容器 */
        .bg-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        .bg-container img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .status-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 50px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 25px; color: white; font-size: 15px; font-weight: 600;
            z-index: 100; pointer-events: none;
        }
        .status-icons { display: flex; gap: 5px; align-items: center; }
        .dynamic-island {
            position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
            width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 101;
        }

        #home-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;
            display: flex; flex-direction: column; padding: 60px 20px 20px;
        }

        .widgets { display: flex; gap: 15px; margin-bottom: 20px; }
        .widget { border-radius: 20px; padding: 15px; flex: 1; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

        .widget.calendar { background: white; color: black; height: 150px; display: flex; flex-direction: column; }
        .widget.calendar .w-date { color: #ff3b30; font-size: 14px; font-weight: 600; }
        .widget.calendar .w-day { font-size: 50px; font-weight: 400; line-height: 1; margin-bottom: 10px; }
        .widget.calendar .w-event { font-size: 12px; display: flex; align-items: center; margin-top: 5px; }
        .widget.calendar .w-event::before { content: ""; display: inline-block; width: 3px; height: 12px; background: #af52de; margin-right: 5px; }

        .widget.weather { background: linear-gradient(135deg, #1e90ff, #00bfff); color: white; height: 150px; position: relative; }
        .widget.weather .w-city { font-size: 16px; font-weight: 500; }
        .widget.weather .w-temp { font-size: 40px; font-weight: 300; margin-top: 5px; }
        .widget.weather .w-desc { font-size: 12px; }
        .widget.weather .w-range { font-size: 12px; margin-top: 2px; }
        .widget.weather .sun-icon { position: absolute; top: 15px; right: 15px; color: #ffeb3b; font-size: 20px; }

        .apps-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 15px; margin-top: 10px; }
        .app { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .app-icon {
            width: 60px; height: 60px; border-radius: 15px; display: flex; justify-content: center; align-items: center;
            font-size: 28px; margin-bottom: 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); position: relative;
        }

        .badge {
            position: absolute; top: -5px; right: -5px; background: #ff3b30; color: white; font-size: 11px; font-weight: bold;
            min-width: 18px; height: 18px; border-radius: 9px; display: flex; justify-content: center; align-items: center; padding: 0 4px;
        }
        .app-name { color: white; font-size: 11px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

        .bg-insta { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .bg-photos { background: #fff; }
        .bg-mail { background: #007aff; }
        .bg-calendar { background: #fff; color: #000; flex-direction: column;}
        .bg-clock { background: #000; color: #fff; }
        .bg-notes { background: #ffd60a; color: #000; }
        .bg-weather { background: #34aadc; }
        .bg-settings { background: #8e8e93; }
        .bg-maps { background: #fff; }

        .dock {
            position: absolute; bottom: 20px; left: 10px; width: calc(100% - 20px); height: 90px;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 30px; display: flex; justify-content: space-around; align-items: center; padding: 0 10px;
        }
        .dock .app-icon { width: 55px; height: 55px; margin-bottom: 0; }

        .home-indicator {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            width: 130px; height: 5px; background: black; border-radius: 10px; z-index: 200;
        }

        /* =========================================
           手机端自适应 (屏幕宽度小于 500px)
           ========================================= */
        @media screen and (max-width: 500px) {
            #phone {
                width: 100vw; height: 100vh; height: 100dvh;
                border-radius: 0; box-shadow: none;
            }
            
            /* 隐藏模拟元素 */
            .dynamic-island, .home-indicator, .status-bar { display: none; }
            
            /* 手机端调整内边距和间距，让布局更紧凑 */
            #home-screen { padding: 30px 15px 20px; }
            .widgets { gap: 10px; margin-bottom: 15px; }
            .widget { padding: 12px; height: 140px; }
            .widget.calendar .w-day { font-size: 45px; }
            .widget.weather .w-temp { font-size: 35px; }
            
            .apps-grid { gap: 15px 10px; }
            .app-icon { width: 55px; height: 55px; font-size: 25px; }
            
            .dock { 
                bottom: 10px; 
                height: 80px; 
                left: 5px; 
                width: calc(100% - 10px);
                border-radius: 25px;
            }
            .dock .app-icon { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>
<div id="phone">
    <div class="bg-container">
        <img src="1.jpg" alt="背景图片" onerror="this.style.display='none'">
    </div>

    <div class="dynamic-island"></div>
    <div class="status-bar">
        <div>6:07</div>
        <div class="status-icons">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="white"><path d="M1 11h2V9H1v2zm4 0h2V7H5v4zm4 0h2V5H9v6zm4 0h2V3h-2v8zm4 0h2V1h-2v10z"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="white"><path d="M8 2.5C5.5 2.5 3.3 3.5 1.7 5.1L0 3.4C2.1 1.3 4.9 0 8 0s5.9 1.3 8 3.4l-1.7 1.7C12.7 3.5 10.5 2.5 8 2.5zm0 4C6.5 6.5 5.1 7.1 4.1 8.1L2.4 6.4C3.9 4.9 5.9 4 8 4s4.1.9 5.6 2.4l-1.7 1.7c-1-1-2.4-1.6-3.9-1.6zm0 3c-1 0-1.9.4-2.5 1L8 12l2.5-2.5C9.9 9 9 8.5 8 8.5z"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="3" stroke="white" stroke-width="1"/><rect x="2" y="2" width="15" height="8" rx="2" fill="white"/><path d="M23 4v4c1.1 0 2-.9 2-2s-.9-2-2-2z" fill="white"/></svg>
        </div>
    </div>

    <div id="home-screen">
        <div class="widgets">
            <div class="widget calendar">
                <div class="w-date">星期六</div>
                <div class="w-day">17</div>
                <div class="w-event">购物 <span style="color:#8e8e93; margin-left:auto; font-size:10px;">全天</span></div>
                <div class="w-event">洗衣服 <span style="color:#8e8e93; margin-left:auto; font-size:10px;">全天</span></div>
            </div>
            <div class="widget weather">
                <div class="sun-icon">☀️</div>
                <div class="w-city">首尔 ↗</div>
                <div class="w-temp">18°</div>
                <div class="w-desc">大部晴朗</div>
                <div class="w-range">最高21° 最低12°</div>
            </div>
        </div>

        <div class="apps-grid">
            <div class="app"><div class="app-icon bg-insta">📷</div><div class="app-name">Instagram</div></div>
            <div class="app"><div class="app-icon bg-photos" style="color:#ffcc00;">🌼</div><div class="app-name">照片</div></div>
            <div class="app"><div class="app-icon bg-mail" style="color:white;">✉️<span class="badge">2</span></div><div class="app-name">邮件</div></div>
            <div class="app">
                <div class="app-icon bg-calendar">
                    <div style="color:red;font-size:9px;font-weight:bold;margin-top:5px;">星期六</div>
                    <div style="font-size:24px;font-weight:400;line-height:1;">17</div>
                </div>
                <div class="app-name">日历</div>
            </div>
            <div class="app"><div class="app-icon bg-clock">🕒</div><div class="app-name">时钟</div></div>
            <div class="app"><div class="app-icon bg-notes">📝</div><div class="app-name">备忘录</div></div>
            <div class="app"><div class="app-icon bg-weather" style="background: linear-gradient(#4facfe, #00f2fe);">⛅</div><div class="app-name">天气</div></div>
            <div class="app"><div class="app-icon bg-settings">⚙️</div><div class="app-name">设置</div></div>
            <div class="app"><div class="app-icon bg-maps" style="color:green;">🗺️</div><div class="app-name">地图</div></div>
        </div>

        <div class="dock">
            <div class="app"><div class="app-icon" style="background:#34c759; color:white;">📞<span class="badge">3</span></div></div>
            <div class="app"><div class="app-icon" style="background:white; color:#007aff; border:1px solid #ccc;">🌐</div></div>
            <div class="app"><div class="app-icon" style="background:#ffcc00; color:black;">💬<span class="badge">15</span></div></div>
            <div class="app"><div class="app-icon" style="background:#ff2d55; color:white;">🎵</div></div>
        </div>
    </div>

    <div class="home-indicator"></div>
</div>
</body>
</html>

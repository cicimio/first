<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone Lock Screen Demo</title>
    <style>
        /* 基础重置与全局设置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 模拟手机屏幕容器 */
        #phone {
            position: relative;
            width: 390px;
            height: 844px;
            background-color: #000;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            /* 禁用文本选择 */
            -webkit-touch-callout: none;
        }

        /* --- 通用状态栏 --- */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            z-index: 100;
            pointer-events: none;
        }
        .status-icons {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .dynamic-island {
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            z-index: 101;
        }

        /* --- 壁纸背景 (模拟宇宙星空) --- */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* =========================================
           状态 1: 锁屏界面 (Lock Screen)
           ========================================= */
        #lock-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        /* 上滑解锁指示器 */
        .swipe-up-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            z-index: 20;
        }

        /* 锁屏内容 */
        .lock-content {
            margin-top: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .lock-date {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .lock-time {
            font-size: 90px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -2px;
        }

        .lock-lang {
            margin-top: 10px;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 10px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 通知卡片 */
        .notification-area {
            position: absolute;
            bottom: 80px;
            width: 100%;
            padding: 0 15px;
            transition: opacity 0.3s;
        }

        .notification {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 12px 15px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            color: #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .notif-icon {
            width: 35px;
            height: 35px;
            background: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
        }
        .notif-icon div {
            width: 15px; height: 15px; border-radius: 50%; background: #ff9f0a; margin: 1px;
        }

        .notif-content {
            flex: 1;
        }
        .notif-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 2px;
        }
        .notif-title {
            font-weight: 600;
        }
        .notif-time {
            color: #333;
        }
        .notif-body {
            font-size: 14px;
            font-weight: 400;
        }

        /* =========================================
           状态 2: 密码界面 (Passcode Screen)
           ========================================= */
        #passcode-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #passcode-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .passcode-header {
            margin-top: 100px;
            color: white;
            text-align: center;
        }

        .lock-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .passcode-title {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        /* 密码圆点 */
        .dots-container {
            display: flex;
            gap: 15px;
        }
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid white;
            background: transparent;
            transition: background 0.1s;
        }
        .dot.filled {
            background: white;
        }

        /* 数字键盘 */
        .keypad {
            margin-top: 50px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px 25px;
            justify-items: center;
        }

        .key {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: white;
            transition: background 0.1s;
        }
        .key:active {
            background: rgba(255, 255, 255, 0.4);
        }

        .key-num {
            font-size: 32px;
            font-weight: 400;
            line-height: 1;
        }
        .key-letters {
            font-size: 10px;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* 空位占位 */
        .key.empty {
            background: transparent;
            pointer-events: none;
        }

        /* 底部操作 */
        .passcode-footer {
            position: absolute;
            bottom: 50px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            color: white;
            font-size: 16px;
        }
        .passcode-footer span {
            cursor: pointer;
        }

        /* =========================================
           状态 3: 桌面 (Home Screen)
           ========================================= */
        #home-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            padding: 60px 20px 20px;
            opacity: 0;
            transform: scale(1.1);
            transition: opacity 0.4s, transform 0.4s;
            pointer-events: none;
        }

        #home-screen.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* 桌面小组件 */
        .widgets {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .widget {
            border-radius: 20px;
            padding: 15px;
            flex: 1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* 日历小组件 */
        .widget.calendar {
            background: white;
            color: black;
            height: 150px;
            display: flex;
            flex-direction: column;
        }
        .widget.calendar .w-date {
            color: #ff3b30;
            font-size: 14px;
            font-weight: 600;
        }
        .widget.calendar .w-day {
            font-size: 50px;
            font-weight: 400;
            line-height: 1;
            margin-bottom: 10px;
        }
        .widget.calendar .w-event {
            font-size: 12px;
            display: flex;
            align-items: center;
            margin-top: 5px;
        }
        .widget.calendar .w-event::before {
            content: "";
            display: inline-block;
            width: 3px;
            height: 12px;
            background: #af52de;
            margin-right: 5px;
        }

        /* 天气小组件 */
        .widget.weather {
            background: linear-gradient(135deg, #1e90ff, #00bfff);
            color: white;
            height: 150px;
            position: relative;
        }
        .widget.weather .w-city {
            font-size: 16px;
            font-weight: 500;
        }
        .widget.weather .w-temp {
            font-size: 40px;
            font-weight: 300;
            margin-top: 5px;
        }
        .widget.weather .w-desc {
            font-size: 12px;
        }
        .widget.weather .w-range {
            font-size: 12px;
            margin-top: 2px;
        }
        .widget.weather .sun-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #ffeb3b;
            font-size: 20px;
        }

        /* App 图标网格 */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 15px;
            margin-top: 10px;
        }

        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            margin-bottom: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            position: relative;
        }

        /* 图标小红点 */
        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff3b30;
            color: white;
            font-size: 11px;
            font-weight: bold;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 4px;
            border: 1.5px solid #1c1c1e; /* 背景色遮罩 */
        }

        .app-name {
            color: white;
            font-size: 11px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* 各个 App 的颜色和图标 (简化版) */
        .bg-insta { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .bg-photos { background: #fff; }
        .bg-mail { background: #007aff; }
        .bg-calendar { background: #fff; color: #000; flex-direction: column;}
        .bg-clock { background: #000; color: #fff; }
        .bg-notes { background: #ffd60a; color: #000; }
        .bg-weather { background: #34aadc; }
        .bg-settings { background: #8e8e93; }
        .bg-maps { background: #fff; }

        /* 底部 Dock 栏 */
        .dock {
            position: absolute;
            bottom: 20px;
            left: 10px;
            width: calc(100% - 20px);
            height: 90px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
        }
        .dock .app-icon {
            width: 55px;
            height: 55px;
            margin-bottom: 0;
        }

        /* 底部小横条 (Home Indicator) */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 5px;
            background: white;
            border-radius: 10px;
            z-index: 200;
            transition: background 0.3s;
        }
        /* 桌面状态下横条变黑 */
        #home-screen.active ~ .home-indicator {
            background: black;
        }

        /* 抖动动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }

    </style>
</head>

<script>
    // 获取 DOM 元素
    const lockScreen = document.getElementById('lock-screen');
    const passcodeScreen = document.getElementById('passcode-screen');
    const homeScreen = document.getElementById('home-screen');
    const passcodeDots = document.querySelectorAll('.dot');
    const cancelBtn = document.getElementById('cancel-btn');
    const keys = document.querySelectorAll('.key[data-val]');
    
    // 核心变量
    let currentPin = "";
    const CORRECT_PIN = "1234"; // 设定密码
    let touchStartY = 0;
    let touchEndY = 0;
    let isDragging = false;

    // --- 1. 上滑解锁交互逻辑 ---
    
    // 鼠标/触摸开始
    function handleDragStart(e) {
        // 只有锁屏状态才响应
        if (!lockScreen.classList.contains('active') && lockScreen.style.opacity !== '1') return;
        
        isDragging = true;
        // 兼容触摸和鼠标事件
        touchStartY = e.touches ? e.touches[0].clientY : e.clientY;
    }

    // 鼠标/触摸移动
    function handleDragMove(e) {
        if (!isDragging) return;
        
        const currentY = e.touches ? e.touches[0].clientY : e.clientY;
        const deltaY = currentY - touchStartY;

        // 如果向上滑动
        if (deltaY < 0) {
            // 阻止页面滚动
            if (e.cancelable) e.preventDefault(); 
            
            // 添加平滑效果，防止过渡拉扯
            lockScreen.style.transition = 'none';
            // 只允许向上移动
            lockScreen.style.transform = `translateY(${deltaY}px)`;
            
            // 渐隐效果
            const opacity = 1 - Math.abs(deltaY) / 300;
            lockScreen.style.opacity = Math.max(0, opacity);
        }
    }

    // 鼠标/触摸结束
    function handleDragEnd(e) {
        if (!isDragging) return;
        isDragging = false;
        
        // 恢复过渡动画
        lockScreen.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease';

        const currentY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
        const deltaY = currentY - touchStartY;

        // 如果滑动距离超过阈值(50px)，则触发解锁进入密码页
        if (deltaY < -50) {
            lockScreen.style.transform = 'translateY(-100%)';
            lockScreen.style.opacity = '0';
            
            // 显示密码页
            passcodeScreen.classList.add('active');
        } else {
            // 否则回弹
            lockScreen.style.transform = 'translateY(0)';
            lockScreen.style.opacity = '1';
        }
    }

    // 绑定事件
    lockScreen.addEventListener('touchstart', handleDragStart, {passive: false});
    lockScreen.addEventListener('touchmove', handleDragMove, {passive: false});
    lockScreen.addEventListener('touchend', handleDragEnd);
    
    // 支持鼠标拖动(为了在电脑上演示)
    lockScreen.addEventListener('mousedown', handleDragStart);
    window.addEventListener('mousemove', handleDragMove);
    window.addEventListener('mouseup', handleDragEnd);


    // --- 2. 密码输入逻辑 ---

    keys.forEach(key => {
        key.addEventListener('click', () => {
            if (currentPin.length < 4) {
                currentPin += key.getAttribute('data-val');
                updateDots();
                
                // 如果输入满4位，进行验证
                if (currentPin.length === 4) {
                    setTimeout(verifyPin, 200); // 稍微延迟，让用户看到第4个点
                }
            }
        });
    });

    function updateDots() {
        passcodeDots.forEach((dot, index) => {
            if (index < currentPin.length) {
                dot.classList.add('filled');
            } else {
                dot.classList.remove('filled');
            }
        });
    }

    function verifyPin() {
        if (currentPin === CORRECT_PIN) {
            // 密码正确，解锁进入桌面
            passcodeScreen.classList.remove('active');
            
            // 将锁屏彻底隐藏，防止再次出现
            lockScreen.style.display = 'none'; 
            
            // 显示桌面
            homeScreen.classList.add('active');
        } else {
            // 密码错误，抖动并清空
            const dotsContainer = document.querySelector('.dots-container');
            dotsContainer.classList.add('shake');
            
            // 错误反馈动画结束后清空
            setTimeout(() => {
                dotsContainer.classList.remove('shake');
                currentPin = "";
                updateDots();
            }, 300);
        }
    }

    // 取消按钮：返回锁屏
    cancelBtn.addEventListener('click', () => {
        passcodeScreen.classList.remove('active');
        
        // 清空密码
        currentPin = "";
        updateDots();
        
        // 恢复锁屏位置
        lockScreen.style.transform = 'translateY(0)';
        lockScreen.style.opacity = '1';
    });

</script>
</body>
</html>
